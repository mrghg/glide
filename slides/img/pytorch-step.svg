<!-- Lower half of architecture.svg, cropped by the viewBox. Regenerate from that file if it changes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 328 1010 282" font-family="Helvetica Neue, Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9db0c7"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/>
    </marker>
  </defs>

  <!-- ===== legend ===== -->
  <g font-size="14">
    <rect x="700" y="22" width="15" height="15" rx="3" fill="none" stroke="#ffb454" stroke-width="2"/>
    <text x="722" y="35" fill="#9db0c7">host CPU</text>
    <rect x="815" y="22" width="15" height="15" rx="3" fill="none" stroke="#5fd0d6" stroke-width="2"/>
    <text x="837" y="35" fill="#9db0c7">GPU</text>
    <rect x="890" y="22" width="15" height="15" rx="3" fill="none" stroke="#9db0c7" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="912" y="35" fill="#9db0c7">stored data</text>
  </g>

  <!-- ===== pipeline row ===== -->
  <!-- ERA5 store -->
  <rect x="25" y="85" width="145" height="80" rx="8" fill="#16263d" stroke="#9db0c7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="97" y="118" fill="#e8eef6" font-size="15" font-weight="600" text-anchor="middle">ERA5</text>
  <text x="97" y="140" fill="#9db0c7" font-size="13" text-anchor="middle">local Zarr store</text>

  <!-- met_reader -->
  <rect x="230" y="85" width="180" height="80" rx="8" fill="#16263d" stroke="#ffb454" stroke-width="2"/>
  <text x="320" y="112" fill="#a8e6cf" font-size="15" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">met_reader</text>
  <text x="320" y="132" fill="#9db0c7" font-size="13" text-anchor="middle">reads only the chunks</text>
  <text x="320" y="150" fill="#9db0c7" font-size="13" text-anchor="middle">the run needs · prefetch</text>

  <!-- gpu_engine -->
  <rect x="475" y="70" width="230" height="110" rx="8" fill="#16263d" stroke="#5fd0d6" stroke-width="2"/>
  <text x="590" y="98" fill="#a8e6cf" font-size="15" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">gpu_engine</text>
  <text x="590" y="120" fill="#cdd8e6" font-size="13" text-anchor="middle">advection (RK2)</text>
  <text x="590" y="138" fill="#cdd8e6" font-size="13" text-anchor="middle">turbulence (Hanna)</text>
  <text x="590" y="156" fill="#cdd8e6" font-size="13" text-anchor="middle">convection (Emanuel)</text>

  <!-- footprint_gridder -->
  <rect x="760" y="85" width="170" height="80" rx="8" fill="#16263d" stroke="#5fd0d6" stroke-width="2"/>
  <text x="845" y="118" fill="#a8e6cf" font-size="14" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">footprint_gridder</text>
  <text x="845" y="140" fill="#9db0c7" font-size="13" text-anchor="middle">residence time → grid</text>

  <!-- output_writer -->
  <rect x="958" y="85" width="122" height="80" rx="8" fill="#16263d" stroke="#ffb454" stroke-width="2"/>
  <text x="1019" y="118" fill="#a8e6cf" font-size="13.5" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">output_writer</text>
  <text x="1019" y="140" fill="#9db0c7" font-size="13" text-anchor="middle">zarr · parquet</text>

  <!-- release_generator -->
  <rect x="230" y="225" width="180" height="60" rx="8" fill="#16263d" stroke="#ffb454" stroke-width="2"/>
  <text x="320" y="250" fill="#a8e6cf" font-size="14" font-weight="600" text-anchor="middle" font-family="Menlo, Consolas, monospace">release_generator</text>
  <text x="320" y="270" fill="#9db0c7" font-size="13" text-anchor="middle">particles per site &amp; time</text>

  <!-- pipeline arrows -->
  <g stroke="#9db0c7" stroke-width="2" marker-end="url(#arr)">
    <line x1="170" y1="125" x2="222" y2="125"/>
    <line x1="410" y1="125" x2="467" y2="125"/>
    <line x1="705" y1="125" x2="752" y2="125"/>
    <line x1="930" y1="125" x2="950" y2="125"/>
    <line x1="410" y1="248" x2="500" y2="188"/>
  </g>

  <!-- swappable-schemes note -->
  <text x="590" y="210" fill="#9db0c7" font-size="12.5" font-style="italic" text-anchor="middle">turbulence &amp; convection are swappable schemes</text>

  <!-- ===== divider ===== -->
  <line x1="30" y1="318" x2="1070" y2="318" stroke="#26405f" stroke-width="1.5"/>
  <text x="550" y="352" fill="#e8eef6" font-size="16.5" font-weight="600" text-anchor="middle">While the GPU moves the particles through one hour, the CPU reads the next hour’s weather</text>

  <!-- ===== swim lanes ===== -->
  <!-- lane labels -->
  <text x="150" y="416" fill="#ffb454" font-size="14" text-anchor="end" font-weight="600">CPU thread</text>
  <text x="150" y="486" fill="#5fd0d6" font-size="14" text-anchor="end" font-weight="600">GPU</text>

  <!-- CPU lane blocks -->
  <g font-size="13" text-anchor="middle">
    <rect x="170" y="390" width="150" height="40" rx="6" fill="#ffb454" fill-opacity="0.14" stroke="#ffb454" stroke-width="1.6"/>
    <text x="245" y="415" fill="#ffd9a0">read weather, hour 1</text>
    <rect x="340" y="390" width="150" height="40" rx="6" fill="#ffb454" fill-opacity="0.14" stroke="#ffb454" stroke-width="1.6"/>
    <text x="415" y="415" fill="#ffd9a0">read weather, hour 2</text>
    <rect x="510" y="390" width="150" height="40" rx="6" fill="#ffb454" fill-opacity="0.14" stroke="#ffb454" stroke-width="1.6"/>
    <text x="585" y="415" fill="#ffd9a0">read weather, hour 3</text>
    <rect x="680" y="390" width="150" height="40" rx="6" fill="#ffb454" fill-opacity="0.14" stroke="#ffb454" stroke-width="1.6"/>
    <text x="755" y="415" fill="#ffd9a0">read weather, hour 4</text>
  </g>

  <!-- GPU lane blocks -->
  <g font-size="13" text-anchor="middle">
    <rect x="170" y="460" width="150" height="40" rx="6" fill="none" stroke="#6b7f99" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="245" y="485" fill="#9db0c7" font-style="italic">waiting for hour 1</text>
    <rect x="340" y="460" width="150" height="40" rx="6" fill="#5fd0d6" fill-opacity="0.14" stroke="#5fd0d6" stroke-width="1.6"/>
    <text x="415" y="485" fill="#bdf0f2">move particles, hour 1</text>
    <rect x="510" y="460" width="150" height="40" rx="6" fill="#5fd0d6" fill-opacity="0.14" stroke="#5fd0d6" stroke-width="1.6"/>
    <text x="585" y="485" fill="#bdf0f2">move particles, hour 2</text>
    <rect x="680" y="460" width="150" height="40" rx="6" fill="#5fd0d6" fill-opacity="0.14" stroke="#5fd0d6" stroke-width="1.6"/>
    <text x="755" y="485" fill="#bdf0f2">move particles, hour 3</text>
    <text x="860" y="485" fill="#9db0c7" font-size="18">…</text>
  </g>

  <!-- handoff arrows: fetched hour n → integrate hour n -->
  <g stroke="#ffb454" stroke-width="1.6" marker-end="url(#arrAmber)" opacity="0.8">
    <line x1="315" y1="432" x2="345" y2="457"/>
    <line x1="485" y1="432" x2="515" y2="457"/>
    <line x1="655" y1="432" x2="685" y2="457"/>
  </g>

  <!-- time axis -->
  <line x1="170" y1="535" x2="880" y2="535" stroke="#6b7f99" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="525" y="558" fill="#9db0c7" font-size="13" text-anchor="middle">wall-clock time</text>

  <!-- takeaway -->
  <text x="550" y="598" fill="#ffb454" font-size="15" font-style="italic" text-anchor="middle">after the first hour, the GPU never waits for weather data</text>
</svg>
