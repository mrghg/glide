# Standard case 4, LEF convective afternoon (docs/reference-runs.md §9), for task A04:
# footprint weighted by the dry-air density while counting (this file) against
# plain seconds converted afterwards (run.sh writes the `none` twin). Reference
# physics as configs/smoke_mhd_single_release.yaml; NAM output grid of
# reference-runs §2; 21,600 particles, 240 h back. GLIDE against GLIDE only.
batch:
  max_releases_per_batch: 1
convection:
  emanuel:
    closure_c: 0.03
  scheme: emanuel_reduced
io:
  zarr_store: data/era5-arco/NAM_20190621-20190715_ERA5-ARCO.zarr
  output_uri: outputs/a04-case4-lef-dry_air
memory:
  gc_every_steps: 50
  guard_check_every_steps: 10
  guard_max_device_allocated_gib: null
  guard_max_device_reserved_gib: null
  guard_max_rss_gib: null
  log_every_steps: 100
  met_cache_max_hours: 4
met_domain:
  alt_max_m: 15000.0
  lat_bounds:
  - 22.0
  - 58.0
  lon_bounds:
  - -120.0
  - -55.0
output_grid:
  lat_bounds:
  - 22.125
  - 57.875
  lon_bounds:
  - -119.875
  - -55.125
  n_time_bins: 1
  density_weighting: dry_air
  n_x: 259
  n_y: 143
  z_edges_m:
  - 0.0
  - 40.0
  - 1000.0
  - 5000.0
release:
  duration_seconds: 3600
  kind: periodic_point
  n_particles_per_release: 21600
  n_releases: 1
  period_seconds: 3600
  point:
    lon: -90.2732
    lat: 45.9451
    alt_agl_m: 30.0
  seed: 42
  start_time: '2019-07-13T20:00:00Z'
simulation:
  device: auto
  dt_seconds: 60
  length_seconds: 864000
  start_time: '2019-07-13T20:00:00Z'
turbulence:
  n_substeps: 8  # sub-steps per outer step, the same for every particle: 7.5 s at dt=60 (decision 0026)
  meander:
    coefficient: 0.16
    enabled: true
  scheme: hanna_1982
