# Task A01 comparison run (pressure40), to separate the level change from the met-source change:
# as model.yaml (40-level default grid) but reading data/era5/EUROPE_*.zarr.
batch:
  max_releases_per_batch: 72
convection:
  emanuel:
    closure_c: 0.03
  scheme: emanuel_reduced
io:
  zarr_store: data/era5/EUROPE_*.zarr
  output_uri: outputs/a01-pressure40
memory:
  gc_every_steps: 50
  guard_check_every_steps: 10
  log_every_steps: 100
  met_cache_max_hours: 48
  met_cache_on_host: true
  met_prefetch: true
met_domain:
  alt_max_m: 15000.0
  lat_bounds:
  - 10.75
  - 79.0
  lon_bounds:
  - -98.0
  - 39.5
output_grid:
  lat_bounds:
  - 10.612
  - 79.174
  lon_bounds:
  - -98.076
  - 39.556
  n_time_bins: 1
  n_x: 391
  n_y: 293
  z_edges_m:
  - 0.0
  - 40.0
  - 1000.0
  - 5000.0
release:
  duration_seconds: 3600
  kind: multi_point_periodic
  n_particles_per_release: 20000
  n_releases: 24
  period_seconds: 3600
  seed: 42
  sites:
  - alt_agl_m: 10.0
    lat: 53.3267
    lon: -9.9046
    name: MHD
  - alt_agl_m: 90.0
    lat: 51.997
    lon: -2.54
    name: RGL
  - alt_agl_m: 185.0
    lat: 52.5176
    lon: 1.1387
    name: TAC
  start_time: 2024-01-01 00:00:00+00:00
simulation:
  device: auto
  dt_seconds: 60
  length_seconds: 432000
  start_time: 2024-01-01 00:00:00+00:00
turbulence:
  meander:
    coefficient: 0.16
    enabled: true
  scheme: hanna_1982
