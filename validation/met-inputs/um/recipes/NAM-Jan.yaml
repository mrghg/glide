# GLIDE task B14: Met Office global UM (NAME's UMG_Mk10PT) for the NAM domain.
# Domain box: GLIDE docs/reference-runs.md §2. Conversion: met-bazarr decision 0003.
format: glide
output: /work/scratch-pw5/{user}/met-bazarr/NAM_20181222-20190115_UMG-Mk10.zarr
domain: {name: NAM, lon_min: -120, lon_max: -55, lat_min: 22, lat_max: 58}
period: {start: "2018-12-22T00:00", end: "2019-01-15T00:00"}
source:
  type: um_global
  series: UMG_Mk10PT
  description: >-
    00/06/12/18Z fields are analyses (T+0), 03/09/15/21Z are 3-hour forecasts
    from the preceding analysis
  met_dir: /gws/ssde/j25a/name/met_archive/Global/UMG_Mk10PT
  file_pattern: "MO{time:%Y%m%d%H%M}.UMG_Mk10_I_L59PT{part}.pp"
  topography: /gws/ssde/j25a/name/data/UMTopogData/TopogUMG_Mk10_PT{part}.pp
compression: {codec: zstd, level: 5}
chunks: {tile: 128}
