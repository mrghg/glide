# Tracer experiment OKC80 (full NAM box; the plan's subdomain is not defined). ERA5 from ARCO on Google Cloud (met-bazarr decision 0006).
# Domain: GLIDE docs/validation-plan.md §4 (EUR, NAM) or the development domain (EUROPE).
format: glide
output: $METBAZARR_OUT/NAM_19800708-19800712_ERA5-ARCO.zarr
domain: {name: NAM, lon_min: -120, lon_max: -55, lat_min: 22, lat_max: 58}
period: {start: "1980-07-08T00:00", end: "1980-07-12T00:00"}
source: {type: era5_arco}
compression: {codec: zstd, level: 5}
chunks: {tile: 128}
